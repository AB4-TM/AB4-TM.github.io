<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link href="styles.css" rel="stylesheet">
    <title>AB5</title>
    <style>
        /* Дополнительные стили для растягивания терминала до низа страницы */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* Контейнер с кнопками и температурой занимает столько места, сколько нужно */
        .content-top {
            flex-shrink: 0;
        }
        
        /* Контейнер для терминала занимает все оставшееся пространство */
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Важно для корректной работы flex внутри */
            margin-top: 20px;
        }
        
        #terminal {
            flex: 1;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            scroll-behavior: smooth;
        }
        /* Стили для выпадающего блока — аккуратный отступ, рамка */
        details {
            margin-top: 12px;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: all 0.1s ease;
        }
        summary {
            font-weight: 600;
            cursor: pointer;
            color: #2c3e66;
            outline: none;
            user-select: none;
        }
        summary:hover {
            color: #1e2a44;
        }
        .custom-temp-container {
            margin-top: 12px;
            margin-left: 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .custom-temp-container label {
            font-weight: 500;
        }
        .custom-temp-container input {
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #aaa;
            width: 100px;
        }
        .custom-temp-container button {
            background-color: #4a6a8b;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s;
        }
        .custom-temp-container button:hover {
            background-color: #2c4c6e;
        }
        /* чтобы старые авто-кнопки выглядели единообразно, но не меняем структуру */
        .section-title {
            margin-top: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="content-top">
    <p>
        <button id="clrBtn" type="button">CLEAR</button>
        <button id="connect" type="button">Connect</button>
        <button id="disconnect" type="button">Disconnect</button>
        <button id="startBtn" type="button">START</button>
        <button id="stopBtn" type="button">STOP</button>
    </p>
    <p>
        <h1>
            Температура: <span id="temperature">...</span>
        </h1>
    </p>

    <p>
        <b>Таблица корректировки</b>
    </p>
    <p>
        <textarea id="tableCorrection" rows="10" cols="50" name="comment"></textarea>
    </p>
    <p>
        <button id="tableRead" type="button">READ</button>
        <button id="tableWrite" type="button">WRITE</button>
    </p>
    <p>
        <button id="AUTO_10" type="button">AUTO(+10)</button>
        <button id="AUTO_100" type="button">AUTO(+100)</button>
        <button id="AUTO_200" type="button">AUTO(+200)</button>
        <button id="AUTO_300" type="button">AUTO(+300)</button>
        <button id="AUTO_400" type="button">AUTO(+400)</button>
        <button id="AUTO_440" type="button">AUTO(+440)</button>
        
        <!-- ВЫПАДАЮЩЕЕ ПОЛЕ: "Произвольное значение температуры" полностью спрятано внутрь details -->
        <details>
            <summary>Произвольное значение температуры</summary>
            <div class="custom-temp-container">
                <label for="customTemp">Температура (°C):</label>
                <input type="number" id="customTemp" step="1" value="22" min="-10" max="500">
                <button id="sendCustomTemp" type="button">AUTO (отправить)</button>
            </div>
        </details>
    </p>
</div>

<div class="terminal-container">
    <div id="terminal">
        <div>Версия V0.0.10</div>
    </div>
</div>

<script src="main.js"></script>

</body>
</html>
