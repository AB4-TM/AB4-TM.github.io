<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link href="styles.css" rel="stylesheet">
    <title>AB5</title>
    <style>
        /* Дополнительные стили для растягивания терминала до низа страницы */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* Контейнер с кнопками и температурой занимает столько места, сколько нужно */
        .content-top {
            flex-shrink: 0;
        }
        
        /* Контейнер для терминала занимает все оставшееся пространство */
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Важно для корректной работы flex внутри */
            margin-top: 20px;
        }
        
        #terminal {
            flex: 1;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

<div class="content-top">
    <p>
        <button id="clrBtn" type="button">CLEAR</button>
        <button id="connect" type="button">Connect</button>
        <button id="disconnect" type="button">Disconnect</button>
        <button id="startBtn" type="button">START</button>
        <button id="stopBtn" type="button">STOP</button>
    </p>
    <p>
        <br>
        <h1>
            Температура: <span id="temperature">...</span>
        </h1>
    </p>
</div>

<div class="terminal-container">
    <div id="terminal">
        <div>Версия V0.0.11</div>
    </div>
</div>

<script src="main.js"></script>

</body>
</html>
